<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <nav><a href="../index.html">Volver atrás</s></a></nav>
    <h1>Ejemplo de tabla simple</h1>
    <table border="1">
        <caption>TITULO DE LA TABLA SIMPLE</caption>
        <tr>
            <td>Encabezado1</td>
            <td>Encabezado2</td>
            <td>Encabezado3</td>
        </tr>
               <tr>
            <td>Celda1</td>
            <td>Celda2</td>
            <td>Celda3</td>
        </tr>
               <tr>
            <td>Celda4</td>
            <td>Celda5</td>
            <td>Celda6</td>
        </tr>
               <tr>
            <td>Celda7</td>
            <td>Celda8</td>
            <td>Celda9</td>
        </tr>
    </table>

    <h1>Ejemplo de tabla combinada</h1>
    ><table border="1">
        <caption>Titulo de tabla combinada</caption>
        <tr>
            <td colspan="2">Encabezado1</td>
            <td rowspan="2">Encabezado3</td>
        </tr>
               <tr>
            <td>Celda1</td>
            <td>Celda2</td>

        </tr>
               <tr>
            <td colspan="2" rowspan="2">Celda4</td>
            <td>Celda5</td>
        
        </tr>
               <tr>
            <td>Celda7</td>

        </tr>
    </table>
</body>
</html>
