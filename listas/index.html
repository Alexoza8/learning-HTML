<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listas</title>
    </head>
    <body>
        <h1>Ejemplo de lista ordenada</h1>  
        <ol>
            <li>Primer elemento</li>
            <li>Segundo Elemento </li>
            <li>Tercer Elemento </li>
        </ol>

        <h1>Ejemplo de lista desordenada</h1>  
            <ul>
                <li>Primer elemento</li>
                <li>Segundo Elemento </li>
                <li>Tercer Elemento </li>
            </ul>
    </body>
</html>
